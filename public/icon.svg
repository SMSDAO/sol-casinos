<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121832" />
      <stop offset="100%" stop-color="#060813" />
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanGlow)" stroke-width="12" opacity="0.8" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2fe" stroke-width="4" stroke-dasharray="16,12" opacity="0.6" />

  <!-- Roulette Wheel Segments Pattern -->
  <g transform="translate(256, 256)">
    <path d="M 0,0 L 0,-160 A 160,160 0 0,1 113,-113 Z" fill="#ff0844" opacity="0.8" />
    <path d="M 0,0 L 113,-113 A 160,160 0 0,1 160,0 Z" fill="#060813" opacity="0.9" />
    <path d="M 0,0 L 160,0 A 160,160 0 0,1 113,113 Z" fill="#ff0844" opacity="0.8" />
    <path d="M 0,0 L 113,113 A 160,160 0 0,1 0,160 Z" fill="#060813" opacity="0.9" />
    <path d="M 0,0 L 0,160 A 160,160 0 0,1 -113,113 Z" fill="#ff0844" opacity="0.8" />
    <path d="M 0,0 L -113,113 A 160,160 0 0,1 -160,0 Z" fill="#060813" opacity="0.9" />
    <path d="M 0,0 L -160,0 A 160,160 0 0,1 -113,-113 Z" fill="#ff0844" opacity="0.8" />
    <path d="M 0,0 L -113,-113 A 160,160 0 0,1 0,-160 Z" fill="#10b981" opacity="0.9" />
  </g>

  <!-- Inner Vault Hub -->
  <circle cx="256" cy="256" r="90" fill="#060813" stroke="url(#cyanGlow)" stroke-width="8" />

  <!-- Center Sparkle / Solstice Emblem -->
  <path d="M 256,196 L 270,242 L 316,256 L 270,270 L 256,316 L 242,270 L 196,256 L 242,242 Z" fill="url(#cyanGlow)" />
</svg>
